services:
  postgres:
    image: postgres:16
    container_name: mineral-pg
    environment:
      POSTGRES_PASSWORD: mineral
      POSTGRES_DB: mineral
    ports:
      - '55432:5432'
    volumes:
      - mineral-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mineral']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mineral-pgdata:
