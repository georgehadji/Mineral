[project]
name = "mineral-analytics"
version = "0.1.0"
description = "Deterministic financial calculations. No LLM, no network, no I/O."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mineral_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
